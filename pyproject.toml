[project]
name = "dola"
version = "0.1.0"
description = "Mean-field study of symmetry-leveraging techniques (DA, FA, EA) in overparametrized shallow networks and deep ResNets, in JAX."
readme = "README.md"
license = "MIT"
authors = [{ name = "Simon Pierre" }]
requires-python = ">=3.13"
dependencies = [
    "jax>=0.9.1",
    "kaleido>=1.2.0",
    "matplotlib>=3.10.8",
    "nbformat>=5.10.4",
    "numpy>=2.4.2",
    "plotly>=6.7.0",
    "pot>=0.9.6.post1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
